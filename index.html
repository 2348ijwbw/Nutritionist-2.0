var KEY="satt-v1";
var S={tab:"plan",day:0,p:{weight:85,height:178,age:17,sex:"m",act:"45",pace:"empf"},checked:{} };

try{
  var raw=localStorage.getItem(KEY);
  if(raw){var o=JSON.parse(raw);if(o&&o.p){for(var k in o.p){S.p[k]=o.p[k];} }if(o&&o.checked){S.checked=o.checked;} }
}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify({p:S.p,checked:S.checked}));}catch(e){} }

function calc(p){
  var w=parseFloat(p.weight)||85,h=parseFloat(p.height)||178,a=parseFloat(p.age)||17;
  var bmr=Math.round(10*w+6.25*h-5*a+(p.sex==="m"?5:-161));
  var f=1.65,i;
  for(i=0;i<ACT.length;i++){if(ACT[i].k===p.act){f=ACT[i].f;} }
  var tdee=Math.round(bmr*f),rate=0.7;
  for(i=0;i<PACE.length;i++){if(PACE[i].k===p.pace){rate=PACE[i].r;} }
  var floor=Math.max(1700,bmr);
  var target=Math.round((tdee-rate*7700/7)/10)*10;
  var clamped=target<floor;
  if(clamped){target=floor;}
  var eff=(tdee-target)*7/7700;
  var weeks=eff>0?Math.ceil(10/eff):0;
  var protein=Math.round(1.8*w),fat=Math.round(0.8*w);
  var carb=Math.max(0,Math.round((target-protein*4-fat*9)/4));
  var dt=new Date();dt.setDate(dt.getDate()+weeks*7);
  var date=dt.toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"});
  var pf=Math.min(1.4,Math.max(0.7,target/2300));
  return {bmr:bmr,tdee:tdee,target:target,protein:protein,fat:fat,carb:carb,
          weeks:weeks,date:date,clamped:clamped,pf:pf};
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function satBar(n){
  var s='<span class="sat">',i;
  for(i=1;i<=5;i++){s+='<i class="'+(i<=n?"f":"")+'"></i>';}
  return s+"</span>";
}

function viewPlan(){
  var c=calc(S.p),d=PLAN[S.day],i;
  var rk=0,rp=0;
  for(i=0;i<d.meals.length;i++){rk+=d.meals[i].kcal;rp+=d.meals[i].protein;}
  var kcal=Math.round(rk*c.pf/10)*10,prot=Math.round(rp*c.pf);
  var h='<div class="note"><b>Ohne Hunger abnehmen</b> heisst nicht weniger essen, sondern <b>klueger</b> essen. '+
        'Viel Eiweiss, viel Volumen, wenig Fleisch. Portionen sind auf dein Ziel skaliert (x'+c.pf.toFixed(2)+').</div>';
  h+='<div class="days">';
  for(i=0;i<PLAN.length;i++){
    h+='<button class="dchip'+(i===S.day?" on":"")+'" data-day="'+i+'">'+esc(PLAN[i].tag)+"</button>";
  }
  h+="</div>";
  h+='<div style="margin-bottom:10px"><span class="badge" style="background:'+FOCUS[d.focus]+'">'+
     esc(d.focus==="Fleisch"?"Fleisch-Tag":d.focus)+"</span></div>";
  h+='<div class="daytot"><div class="b"><div class="v">'+kcal+'</div><div class="u">kcal</div></div>'+
     '<div class="b"><div class="v">'+prot+' g</div><div class="u">Eiweiss</div></div>'+
     '<div class="b"><div class="v">'+(kcal-c.target>0?"+":"")+(kcal-c.target)+'</div><div class="u">vs Ziel</div></div></div>';
  h+='<div class="card">';
  for(i=0;i<d.meals.length;i++){
    var m=d.meals[i];
    h+='<div class="meal'+(i===0?" first":"")+'"><div class="slot">'+esc(m.slot)+"</div>"+
       '<div class="nm">'+esc(m.nm)+'</div><div class="it">'+esc(m.it)+"</div>"+
       '<div class="row"><span class="kp"><b>'+Math.round(m.kcal*c.pf)+'</b> kcal &middot; <b>'+
       Math.round(m.protein*c.pf)+' g</b> Eiweiss</span>'+satBar(m.sat)+"</div></div>";
  }
  h+="</div>";
  h+='<div class="lbl" style="margin:18px 4px 8px">Warum du satt bleibst</div><div class="card">';
  for(i=0;i<PRIN.length;i++){
    h+='<div class="prin'+(i===0?" first":"")+'"><div class="n">'+PRIN[i].n+'</div>'+
       '<div class="tx"><b>'+esc(PRIN[i].t)+"</b> "+esc(PRIN[i].d)+"</div></div>";
  }
  return h+"</div>";
}

function viewShop(){
  var total=0,done=0,gi,ii;
  for(gi=0;gi<SHOP.length;gi++){total+=SHOP[gi].items.length;}
  for(var key in S.checked){if(S.checked[key]){done++;} }
  var h='<div class="fuel" style="background:#2e5d3b"><div class="cap">Wocheneinkauf &middot; 1 Person</div>'+

         '<div class="cb'+(on?" on":"")+'">'+(on?"&#10003;":"")+"</div><div style=\"flex:1\">"+
         '<div class="nm">'+esc(it.nm)+'</div><div class="br">'+esc(it.br)+"</div>"+
         '<div class="meta"><span class="qtytag">'+esc(it.qty)+"</span>"+esc(it.store)+"</div></div></div>";
    }
    h+="</div></div>";
  }
  h+='<div class="lbl" style="margin:18px 4px 8px">Laeden in deiner Naehe</div><div class="card">';
  for(gi=0;gi<STORES.length;gi++){
    var s=STORES[gi];
    h+='<div class="store'+(gi===0?" first":"")+'"><div class="pin">'+esc(s.pin)+"</div><div>"+

  }
  return h+'</div><div class="note">Entfernungen ab Blankeneser Bahnhof, ungefaehr.</div>';
}

function viewYou(){
  var c=calc(S.p),i;
  var h='<div class="fuel"><div class="cap">Dein Tagesziel</div>'+

        '<div class="macros"><div class="macro"><div class="m">'+c.protein+'</div><div class="u">g Eiweiss</div></div>'+

        '<div class="macro"><div class="m">'+c.fat+'</div><div class="u">g Fett</div></div></div>'+
        '<div class="pace"><div class="p"><div class="v">'+c.tdee+'</div><div class="k">Verbrauch/Tag</div></div>'+

        '<div class="p"><div class="v">'+c.date+'</div><div class="k">Zieldatum</div></div></div></div>';

  h+='<div class="lbl" style="margin:4px 4px 8px">Deine Daten</div><div class="card">'+

     '<input class="inp" type="number" inputmode="numeric" data-num="age" value="'+S.p.age+'"></div>'+
     '<div class="field" style="flex:1"><label class="lbl">Geschlecht</label><div class="seg">'+
     '<button class="'+(S.p.sex==="m"?"on":"")+'" data-set="sex" data-val="m">M</button>'+
     '<button class="'+(S.p.sex==="w"?"on":"")+'" data-set="sex" data-val="w">W</button></div></div></div>';

    h+='<button class="'+(S.p.act===ACT[i].k?"on":"")+'" data-set="act" data-val="'+ACT[i].k+'">'+
       esc(ACT[i].label)+"</button>";
  }
  h+='</div></div><div class="field"><label class="lbl">Tempo</label><div class="seg">';
  for(i=0;i<PACE.length;i++){
    h+='<button class="'+(S.p.pace===PACE[i].k?"on":"")+'" data-set="pace" data-val="'+PACE[i].k+'">'+
       esc(PACE[i].label)+"<small>"+esc(PACE[i].d)+"</small></button>";
  }
  h+="</div></div></div>";
  return h+'<div class="note">Richtwerte nach Mifflin-St-Jeor - kein Ersatz fuer aerztliche Beratung. '+
     'Dein Whoop zeigt den echten Verbrauch oft genauer; liegt er dauerhaft hoeher, darfst du etwas mehr essen.</div>';
}

function render(){
  var v=document.getElementById("view");
  v.innerHTML=S.tab==="plan"?viewPlan():(S.tab==="shop"?viewShop():viewYou());
  var b=document.querySelectorAll(".nav button"),i;
  for(i=0;i<b.length;i++){
    if(b[i].getAttribute("data-tab")===S.tab){b[i].className="on";}else{b[i].className="";}
  }
  window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var t=e.target,n;
  while(t&&t!==document.body){
    if(t.getAttribute){
      if((n=t.getAttribute("data-tab"))){S.tab=n;render();return;}
      if((n=t.getAttribute("data-day"))!==null&&n!==undefined&&n!==""){S.day=parseInt(n,10);render();return;}
      if((n=t.getAttribute("data-item"))){S.checked[n]=!S.checked[n];save();render();return;}
      if((n=t.getAttribute("data-set"))){S.p[n]=t.getAttribute("data-val");save();render();return;}
    }
    t=t.parentNode;
  }
});

document.addEventListener("input",function(e){
  var f=e.target.getAttribute?e.target.getAttribute("data-num"):null;
  if(f){S.p[f]=e.target.value;save();}
});

document.addEventListener("change",function(e){
  var f=e.target.getAttribute?e.target.getAttribute("data-num"):null;
  if(f){render();}
});

document.getElementById("appicon").src=ICON_SRC;
render();
