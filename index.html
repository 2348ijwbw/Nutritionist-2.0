  async get(k){ try{ const v = localStorage.getItem(k); return v==null?null:{value:v}; }catch(e){ return null; } },
  async set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} return {}; }

/*  SATT — Ivans persönlicher Ernährungs-Coach
    Ziel: ~10 kg abnehmen, ohne hungrig zu sein · weniger Fleisch
    Wochenplan + Marken-Einkaufsliste für 22587 Hamburg (Blankenese) */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#17211c; --paper:#e7ebe2; --card:#f6f8f2; --card2:#eef1e8;
  --volt:#c6e600; --forest:#2e5d3b; --steel:#2f6e8f; --brick:#9e3b2a;
  --amber:#e0a000; --olive:#6b7a2e; --line:#c8cec0; --muted:#5b6a5d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.na-root{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100vh;line-height:1.45}
.na-wrap{max-width:480px;margin:0 auto;padding:0 0 92px;position:relative}
.na-mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.na-disp{font-family:'Archivo',sans-serif}

/* header */
.na-top{padding:22px 20px 14px;border-bottom:2px solid var(--ink);background:var(--paper);
  position:sticky;top:0;z-index:5}
.na-brand{display:flex;align-items:center;gap:10px}
.na-brand .appicon{width:36px;height:36px;border-radius:10px;object-fit:cover;border:2px solid var(--ink);flex:0 0 auto}
.na-brand h1{font-family:'Archivo';font-weight:900;font-size:30px;letter-spacing:-.02em;margin:0;
  text-transform:uppercase}
.na-brand .dot{width:12px;height:12px;background:var(--volt);border:2px solid var(--ink);
  border-radius:50%;transform:translateY(-2px)}
.na-sub{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.01em}

.na-screen{padding:16px 16px 4px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* labels + cards */
.lbl{font-family:'IBM Plex Mono';font-weight:600;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:14px}
.card.tight{padding:13px}

/* fuel / nutrition-label panel */
.fuel{background:var(--ink);color:var(--paper);border-radius:16px;padding:18px 18px 16px;margin-bottom:14px}
.fuel .cap{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--volt)}
.fuel .big{font-family:'Archivo';font-weight:900;font-size:58px;line-height:.92;letter-spacing:-.03em;margin:6px 0 0}
.fuel .big small{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;letter-spacing:.02em;
  margin-left:6px;color:var(--volt)}
.fuel .rule{height:2px;background:var(--volt);margin:14px 0 12px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macro{border:1px solid #3a463c;border-radius:10px;padding:9px 8px;text-align:center}
.macro .m{font-family:'Archivo';font-weight:800;font-size:22px}
.macro .u{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#a7b0a2}

.pace{display:flex;gap:8px;margin-top:12px}
.pace .p{flex:1;background:#222d26;border-radius:10px;padding:9px 8px}
.pace .p .v{font-family:'Archivo';font-weight:800;font-size:17px}
.pace .p .k{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#a7b0a2;margin-top:1px}

/* inputs */
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px}
.inp{width:100%;font-family:'IBM Plex Mono';font-weight:600;font-size:17px;color:var(--ink);
  background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;font-family:'IBM Plex Sans';font-weight:600;font-size:12.5px;
  padding:9px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* day chips + plan */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;font-family:'Archivo';font-weight:800;font-size:13px;padding:8px 13px;border-radius:11px;
  border:1.5px solid var(--ink);background:var(--card);cursor:pointer;text-transform:uppercase;letter-spacing:.01em}
.dchip.on{background:var(--volt)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono';font-weight:600;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:4px 9px;border-radius:20px}

.meal{border-top:1px solid var(--line);padding:12px 0}
.meal:first-of-type{border-top:none}
.meal .slot{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meal .nm{font-weight:700;font-size:15px;margin:2px 0 3px}
.meal .it{font-size:12.5px;color:var(--muted)}
.meal .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:7px}
.kp{font-family:'IBM Plex Mono';font-weight:600;font-size:11.5px}
.kp b{color:var(--forest)}
.sat{display:flex;gap:3px;align-items:center}
.sat i{width:7px;height:14px;border-radius:2px;background:var(--line);display:block}
.sat i.f{background:var(--volt);border:1px solid var(--ink)}
.sat .t{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:4px}

.daytot{display:flex;gap:8px;margin:2px 0 4px}
.daytot .b{flex:1;background:var(--card2);border:1.5px solid var(--ink);border-radius:11px;padding:10px;text-align:center}
.daytot .b .v{font-family:'Archivo';font-weight:800;font-size:22px}
.daytot .b .u{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* shopping */
.grp{margin-bottom:6px}
.grp h3{font-family:'Archivo';font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.01em;
  margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.grp h3 .cnt{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);font-weight:600}
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.cb{flex:0 0 auto;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);
  cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cb.on{background:var(--volt)}
.cb svg{width:14px;height:14px}
.item .nm{font-weight:600;font-size:14px}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .br{font-size:12px;color:var(--forest);font-weight:500;margin-top:1px}
.item .meta{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);letter-spacing:.02em;margin-top:3px;
  display:flex;gap:8px;flex-wrap:wrap}
.qtytag{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

.store{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.store:first-child{border-top:none}
.store .pin{font-family:'Archivo';font-weight:900;font-size:11px;background:var(--ink);color:var(--paper);
  border-radius:7px;padding:6px 8px;height:fit-content;white-space:nowrap}
.store .nm{font-weight:700;font-size:14px}
.store .ad{font-size:12px;color:var(--muted)}
.store .no{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--forest);margin-top:2px}

/* coach */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:86%;padding:11px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--card);border:1.5px solid var(--ink);border-bottom-left-radius:4px}
.sugg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.sugg button{font-size:12px;font-weight:600;padding:8px 11px;border:1.5px solid var(--ink);border-radius:20px;
  background:var(--card);cursor:pointer;text-align:left}
.ask{display:flex;gap:8px;position:sticky;bottom:96px}
.ask input{flex:1;font-size:14px;padding:12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);outline:none}
.send{background:var(--volt);border:1.5px solid var(--ink);border-radius:12px;padding:0 16px;font-family:'Archivo';
  font-weight:800;cursor:pointer;font-size:14px}
.send:disabled{opacity:.5}

.note{font-size:12px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:14px}
.note b{color:var(--ink)}

.prin{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prin:first-of-type{border-top:none}
.prin .n{font-family:'Archivo';font-weight:900;font-size:14px;color:var(--forest);flex:0 0 22px}
.prin .tx{font-size:13px}
.prin .tx b{font-weight:700}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);
  border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}
.nav button{background:none;border:none;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted);font-family:'IBM Plex Sans';font-weight:600;font-size:10.5px}
.nav button.on{color:var(--ink)}
.nav button.on .ico{background:var(--volt)}
.nav .ico{width:38px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid transparent}
.nav button.on .ico{border-color:var(--ink)}
.nav svg{width:19px;height:19px}
`;

const KEY = "satt:v1";
const DEFAULT = { weight: 85, height: 178, age: 17, sex: "m", act: "45", pace: "empf" };

function calc(p) {
  const w = +p.weight || 85, h = +p.height || 178, a = +p.age || 17;
  const bmr = Math.round(10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161));
  const f = (ACT.find(x => x.k === p.act) || ACT[2]).f;
  const tdee = Math.round(bmr * f);
  const rate = (PACE.find(x => x.k === p.pace) || PACE[1]).r;
  const floor = Math.max(1700, bmr);
  let target = Math.round((tdee - rate * 7700 / 7) / 10) * 10;
  const clamped = target < floor;
  if (clamped) target = floor;
  const effRate = (tdee - target) * 7 / 7700;
  const weeks = effRate > 0 ? Math.ceil(10 / effRate) : 0;
  const protein = Math.round(1.8 * w);
  const fat = Math.round(0.8 * w);
  const carb = Math.max(0, Math.round((target - protein * 4 - fat * 9) / 4));
  const done = new Date(); done.setDate(done.getDate() + weeks * 7);
  const date = done.toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" });
  const pf = Math.min(1.4, Math.max(0.7, target / 2300));
  return { bmr, tdee, target, protein, fat, carb, weeks, date, clamped, effRate, pf };
}

    })();

      try { await store.set(KEY, JSON.stringify({ p, checked }), false); } catch (e) {}
    })();

function SatBar({ n }) {

function PlanTab({ c, day, setDay }) {

  const prot = Math.round(raw.p * c.pf);
  const avgSat = (d.meals.reduce((a, m) => a + m.sat, 0) / d.meals.length).toFixed(1);

  return (
    <div className="na-screen">
      <div className="note">
        <b>Ohne Hunger abnehmen</b> heißt nicht weniger essen, sondern <b>klüger</b> essen. Der Plan ist auf Sättigung gebaut – volle Portionen, viel Eiweiß, wenig Fleisch. Portionen sind auf dein Ziel skaliert (×{c.pf.toFixed(2)}).
      </div>

      <div className="days">
        {PLAN.map((x, i) => (
          <button key={i} className={"dchip" + (i === day ? " on" : "")} onClick={() => setDay(i)}>{x.tag}</button>

        <span className="kp">Ø <b>{avgSat}</b>/5 Sättigung</span>
      </div>

      <div className="daytot">
        <div className="b"><div className="v">{kcal}</div><div className="u">kcal</div></div>
        <div className="b"><div className="v">{prot} g</div><div className="u">Eiweiß</div></div>
        <div className="b"><div className="v">{Math.round(kcal - c.target)}</div><div className="u">vs Ziel</div></div>
      </div>

      <div className="card">
        {d.meals.map((m, i) => (
          <div className="meal" key={i}>
            <div className="slot">{m.slot}</div>
            <div className="nm">{m.nm}</div>
            <div className="it">{m.it}</div>
            <div className="row">
              <span className="kp"><b>{Math.round(m.kcal * c.pf)}</b> kcal · <b>{Math.round(m.protein * c.pf)} g</b> Eiweiß</span>
              <SatBar n={m.sat} />
            </div>
          </div>
        ))}

      <div className="lbl" style={{ margin: "18px 4px 8px" }}>Warum du satt bleibst</div>

            <div className="tx"><b>{x.t}</b> {x.d}</div>
          </div>

  );
}
